name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # The gates run once, before any installer is built. Nothing gets published
  # from a tree that does not typecheck, lint and pass its tests.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build:
    name: Build ${{ matrix.os }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compile the ad and tracker filter lists
        # Fetched here rather than at runtime: the app itself never asks for a
        # filter list, so the lists are baked into each release.
        run: npm run filters:update

      - name: Build and publish
        run: npm run release
        env:
          # Injected by Actions. No personal access token is involved anywhere
          # in this project.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: vela-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.yml
            release/*.blockmap
          if-no-files-found: warn
          retention-days: 14

# The landing page is not deployed from here. Pages is configured to serve
# `docs/` straight off main, so every push that touches the page is already
# live by the time a tag is cut — and `actions/deploy-pages` refuses to run
# against a repository configured that way, so a job here would fail the first
# release rather than publish anything. Switching Pages to build from a
# workflow is a settings change, not a workflow change, and there is nothing to
# gain from it while the page is static files in the repo.
