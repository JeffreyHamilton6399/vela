<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in</title>
  </head>
  <body>
    <h1>Sign in</h1>
    <!--
      Posts and navigates, which is what a real login does. The captured
      credential has to leave the page before this navigation tears it down.
    -->
    <form method="GET" action="/done.html">
      <input id="username" name="username" autocomplete="username" />
      <input id="password" name="pw" type="password" autocomplete="current-password" />
      <button type="submit">Sign in</button>
    </form>
  </body>
</html>
