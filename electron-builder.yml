appId: com.vela.browser
productName: Vela
copyright: Vela contributors

directories:
  output: release
  buildResources: build

# Only what the app actually runs. Sources, tests and configs stay out.
files:
  - out/**/*
  - build/icon.png
  - package.json
  - '!**/*.map'
  # llama.cpp ships a prebuilt binary per backend, and the GPU ones are most of
  # the weight: CUDA is 163 MB and its extras another 347, Vulkan 95, against
  # 46 for plain CPU. Shipping all of them would quadruple the installer for
  # hardware most people do not have, so Vela carries the CPU build only.
  - '!node_modules/@node-llama-cpp/*-cuda*/**'
  - '!node_modules/@node-llama-cpp/*-vulkan/**'

extraResources:
  # The ad/tracker engine compiled by scripts/fetch-filters.mjs. Shipping it
  # is what lets Vela block without ever fetching a filter list at runtime.
  - from: resources/adblock-engine.bin
    to: adblock-engine.bin
  - from: resources/adblock-engine.json
    to: adblock-engine.json

asar: true
# Node's own compile cache; the app is faster on second launch for free.
electronLanguages:
  - en-US

publish:
  provider: github
  owner: JeffreyHamilton6399
  repo: vela
  releaseType: release

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64, arm64]
  artifactName: Vela-${version}-windows-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

mac:
  icon: build/icon.png
  target:
    - target: dmg
      arch: [universal]
  category: public.app-category.productivity
  artifactName: Vela-${version}-macos-${arch}.${ext}
  # Unsigned for now: see the install notes in the README.
  identity: null

linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64, arm64]
  category: Network;WebBrowser
  synopsis: A privacy-focused web browser
  # The .desktop filename comes from `desktopName` in package.json, which is
  # what `syncDesktopName` reads — it is not an option here, and electron-builder
  # rejects the whole config for carrying it. Setting it in both places is what
  # kept every Linux and macOS build from ever starting.
  syncDesktopName: true
  artifactName: Vela-${version}-linux-${arch}.${ext}
  desktop:
    entry:
      Name: Vela
      Comment: A privacy-focused web browser
      Categories: Network;WebBrowser;
